apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
  annotations:
    # Use Traefik's unencrypted web entry point for the first lab iteration.
    # Internal TLS will be a later improvement.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  # K3s installs Traefik as its default ingress controller.
  ingressClassName: traefik

  rules:
    # OPNsense DNS will eventually resolve this internal-only name.
    - host: k8s-demo.home
      http:
        paths:
          # Every request under / is forwarded to the demo-app Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
